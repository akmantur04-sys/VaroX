name: Build VaroX
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-26.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: VaroX-jar
          path: '**/target/VaroX-*.jar'
